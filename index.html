<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#FAF7F2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="All4UEnglish" />
    <link rel="manifest" href="/manifest.json" />
    <title>All4UEnglish - 아내를 위한 AI 영어 학습</title>
    
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- Pretendard CDN for Korean -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

    <!-- 카카오톡 인앱 브라우저 -> 기본 브라우저 자동 전환 스크립트 (구글 로그인 차단 방지) -->
    <script>
      (function() {
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/KAKAOTALK/i.test(userAgent)) {
          if (/Android/i.test(userAgent)) {
            var cleanUrl = location.href.replace(/^https?:\/\//i, '');
            location.href = 'intent://' + cleanUrl + '#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
          } else if (/iPhone|iPad|iPod/i.test(userAgent)) {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.href);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
